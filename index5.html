<style>
  :root{
    --bg: #F1E7C6;
    --bg-soft: #EADFB8;
    --gold: #C79A2E;
    --gold-dim: #8f6b1f;
    --cream: #3E2C18;
    --muted: #7C6740;
    --line: rgba(62,44,24,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22130%22%20viewBox%3D%220%200%20240%20130%22%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%239c7a3c%22%20stroke-width%3D%221.3%22%20opacity%3D%220.5%22%3E%0A%3Cline%20x1%3D%220%22%20y1%3D%2265%22%20x2%3D%22240%22%20y2%3D%2265%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%2238%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%2224%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%227%22/%3E%0A%3Cpath%20d%3D%22M120%2027%20L120%20103%22/%3E%0A%3Cpath%20d%3D%22M82%2065%20L158%2065%22/%3E%0A%3Cpath%20d%3D%22M95.1%2040.1%20L144.9%2089.9%22/%3E%0A%3Cpath%20d%3D%22M144.9%2040.1%20L95.1%2089.9%22/%3E%0A%3Cpath%20d%3D%22M40%2065%20a20%2020%200%200%201%2040%200%20a20%2020%200%200%201%20-40%200%22/%3E%0A%3Cpath%20d%3D%22M160%2065%20a20%2020%200%200%201%2040%200%20a20%2020%200%200%201%20-40%200%22/%3E%0A%3Ccircle%20cx%3D%2240%22%20cy%3D%2265%22%20r%3D%225%22/%3E%0A%3Ccircle%20cx%3D%22200%22%20cy%3D%2265%22%20r%3D%225%22/%3E%0A%3Cpath%20d%3D%22M0%2065%20a20%2020%200%200%201%2020%20-20%22/%3E%0A%3Cpath%20d%3D%22M0%2065%20a20%2020%200%200%200%2020%2020%22/%3E%0A%3Cpath%20d%3D%22M240%2065%20a20%2020%200%200%200%20-20%20-20%22/%3E%0A%3Cpath%20d%3D%22M240%2065%20a20%2020%200%200%201%20-20%2020%22/%3E%0A%3C/g%3E%0A%3C/svg%3E") repeat-x top center / 240px 130px,
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22130%22%20viewBox%3D%220%200%20240%20130%22%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%239c7a3c%22%20stroke-width%3D%221.3%22%20opacity%3D%220.5%22%3E%0A%3Cline%20x1%3D%220%22%20y1%3D%2265%22%20x2%3D%22240%22%20y2%3D%2265%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%2238%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%2224%22/%3E%0A%3Ccircle%20cx%3D%22120%22%20cy%3D%2265%22%20r%3D%227%22/%3E%0A%3Cpath%20d%3D%22M120%2027%20L120%20103%22/%3E%0A%3Cpath%20d%3D%22M82%2065%20L158%2065%22/%3E%0A%3Cpath%20d%3D%22M95.1%2040.1%20L144.9%2089.9%22/%3E%0A%3Cpath%20d%3D%22M144.9%2040.1%20L95.1%2089.9%22/%3E%0A%3Cpath%20d%3D%22M40%2065%20a20%2020%200%200%201%2040%200%20a20%2020%200%200%201%20-40%200%22/%3E%0A%3Cpath%20d%3D%22M160%2065%20a20%2020%200%200%201%2040%200%20a20%2020%200%200%201%20-40%200%22/%3E%0A%3Ccircle%20cx%3D%2240%22%20cy%3D%2265%22%20r%3D%225%22/%3E%0A%3Ccircle%20cx%3D%22200%22%20cy%3D%2265%22%20r%3D%225%22/%3E%0A%3Cpath%20d%3D%22M0%2065%20a20%2020%200%200%201%2020%20-20%22/%3E%0A%3Cpath%20d%3D%22M0%2065%20a20%2020%200%200%200%2020%2020%22/%3E%0A%3Cpath%20d%3D%22M240%2065%20a20%2020%200%200%200%20-20%20-20%22/%3E%0A%3Cpath%20d%3D%22M240%2065%20a20%2020%200%200%201%20-20%2020%22/%3E%0A%3C/g%3E%0A%3C/svg%3E") repeat-x bottom center / 240px 130px,
      radial-gradient(120% 90% at 50% 10%, #F7EFD4 0%, var(--bg) 55%, #E4D5A6 100%);
    color: var(--cream);
    font-family: 'Cairo', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 90px 20px;
    position: relative;
  }
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22900%22%20height%3D%22500%22%20viewBox%3D%220%200%20900%20500%22%3E%0A%3Cg%20fill%3D%22%238a6a3a%22%3E%0A%3Crect%20x%3D%2260%22%20y%3D%22380%22%20width%3D%2224%22%20height%3D%22120%22/%3E%0A%3Crect%20x%3D%22816%22%20y%3D%22380%22%20width%3D%2224%22%20height%3D%22120%22/%3E%0A%3Cpolygon%20points%3D%2272%2C320%2090%2C380%2054%2C380%22/%3E%0A%3Cpolygon%20points%3D%22828%2C320%20846%2C380%20810%2C380%22/%3E%0A%3Ccircle%20cx%3D%2272%22%20cy%3D%22308%22%20r%3D%227%22/%3E%0A%3Ccircle%20cx%3D%22828%22%20cy%3D%22308%22%20r%3D%227%22/%3E%0A%3Cpath%20d%3D%22M180%20500%20L180%20360%20Q180%20300%20240%20300%20Q300%20300%20300%20360%20L300%20500%20Z%22/%3E%0A%3Cpath%20d%3D%22M600%20500%20L600%20360%20Q600%20300%20660%20300%20Q720%20300%20720%20360%20L720%20500%20Z%22/%3E%0A%3Cpath%20d%3D%22M330%20500%20L330%20260%20Q450%20130%20570%20260%20L570%20500%20Z%22/%3E%0A%3Ccircle%20cx%3D%22450%22%20cy%3D%22120%22%20r%3D%2210%22/%3E%0A%3Crect%20x%3D%22446%22%20y%3D%2280%22%20width%3D%228%22%20height%3D%2240%22/%3E%0A%3Cg%20opacity%3D%220.85%22%3E%0A%3Crect%20x%3D%22150%22%20y%3D%22440%22%20width%3D%22600%22%20height%3D%2260%22/%3E%0A%3C/g%3E%0A%3C/g%3E%0A%3C/svg%3E") no-repeat center 46% / 62% auto;
    opacity: 0.10;
    pointer-events: none;
    z-index: 0;
  }
  .card{ position: relative; z-index: 1; }
  .card{
    width:100%;
    max-width: 460px;
    text-align:center;
    background: rgba(255, 251, 235, 0.62);
    border: 1px solid rgba(62,44,24,0.10);
    border-radius: 24px;
    padding: 36px 26px 30px;
    box-shadow: 0 10px 40px rgba(62,44,24,0.10);
    backdrop-filter: blur(2px);
  }
  .lang-toggle{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--cream);
    background: rgba(251,241,219,0.06);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 7px 16px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: border-color .15s ease, background .15s ease;
  }
  .lang-toggle:hover{
    border-color: var(--gold-dim);
    background: rgba(201,162,39,0.08);
  }
  .logo-ring{
    width: 148px;
    height: 148px;
    margin: 0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-inner{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 42px;
    color: var(--gold);
    font-weight:900;
  }
  .logo-inner img{width:100%;height:100%;object-fit:contain;}

  h1{
    font-size: 30px;
    font-weight: 900;
    margin: 0 0 8px;
    color: var(--cream);
  }
  .tagline{
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 34px;
    font-weight:400;
  }

  .rule{
    width: 46px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 30px;
    border-radius: 2px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-bottom: 30px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 15px 20px;
    border-radius: 12px;
    font-family:inherit;
    font-size: 15.5px;
    font-weight:600;
    text-decoration:none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    border: 1px solid var(--line);
    color: var(--cream);
  }
  .btn:active{ transform: scale(0.98); }
  .btn.primary{
    background: var(--gold);
    color: #16261D;
    border-color: var(--gold);
    font-weight:700;
  }
  .btn.primary:hover{ background:#dcb632; }
  .btn.ghost:hover{
    border-color: var(--gold-dim);
    background: rgba(201,162,39,0.06);
  }
  .btn svg{ flex-shrink:0; }

  .divider-text{
    display:flex;
    align-items:center;
    gap: 12px;
    color: var(--muted);
    font-size: 12.5px;
    margin: 26px 0 18px;
  }
  .divider-text::before,
  .divider-text::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .social{
    display:flex;
    justify-content:center;
    gap: 14px;
  }
  .social a{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--cream);
    text-decoration:none;
    transition: border-color .15s ease, color .15s ease;
  }
  .social a:hover{
    border-color: var(--gold);
    color: var(--gold);
  }

  .footnote{
    margin-top: 36px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
</style>
</head>

      review: "قيّمنا على جوجل",
      follow: "تابعنا",
      footnote: "شغفٌ يُتقن.. ومذاقٌ يُبهر",
      toggleLabel: "English",
      dir: "rtl",
      lang: "ar"
    },
    en: {
      title: "Daria Restaurants",
      tagline: "Homestyle flavors, restaurant spirit",
      menu: "View Menu",
      call: "Call Us",
      location: "Our Location",
      review: "Rate Us on Google",
      follow: "Follow Us",
      footnote: "General template — edit the name, logo, links, and colors for your business",
      toggleLabel: "عربي",
      dir: "ltr",
      lang: "en"
    }
  };

  let currentLang = "ar";

  function applyLang(lang){
    const t = translations[lang];
    document.getElementById("txt-title").textContent = t.title;
    document.getElementById("txt-tagline").textContent = t.tagline;
    document.getElementById("txt-menu").textContent = t.menu;
    document.getElementById("txt-call").textContent = t.call;
    document.getElementById("txt-location").textContent = t.location;
    document.getElementById("txt-review").textContent = t.review;
    document.getElementById("txt-follow").textContent = t.follow;
    document.getElementById("txt-footnote").textContent = t.footnote;
    document.getElementById("langToggle").textContent = t.toggleLabel;
    document.documentElement.setAttribute("dir", t.dir);
    document.documentElement.setAttribute("lang", t.lang);
    document.title = t.title;
    currentLang = lang;
  }

  function toggleLang(){
    applyLang(currentLang === "ar" ? "en" : "ar");
  }
</script>

</body>
</html>
